# Planning de publication — Ingénieur Malin
# Source des créneaux : Metricool getBestTimeToPostByNetwork, lu le 2026-11-03
# (semaine du 4 au 10 nov. 2026, fuseau Europe/Paris). À relire chaque semaine.

metricool:
  marque: ingenieur.malin
  brand_id: 7844668
  fuseau: Europe/Paris
  reseaux:
    instagram: ingenieur.malin
    tiktok: ingenieur.malin_off

# Interrupteur de validation d'Ilan : tant qu'il vaut false, la tâche du soir produit et héberge,
# mais ne programme RIEN dans Metricool. Le passer à true (et activer les 2 Routines) = validation en un geste.
programmation_active: false

cadence:
  videos_par_jour: 2          # Reel Instagram + vidéo TikTok (même montage)
  stories_par_jour: 2         # Instagram uniquement
  avance_programmation_h: 24  # tout ce qui sort le jour J est programmé la veille

# Créneaux actuels (heure de Paris). Pics Metricool : 10 h et 18 h, tous les jours,
# sur les deux réseaux. Le samedi et le dimanche, l'audience est environ deux fois plus basse.
creneaux:
  videos:
    - "10:00"
    - "18:00"
  stories:
    - "12:00"   # 2e pic Instagram de la journée
    - "19:00"   # fin de soirée, encore forte sur Instagram

# Programme type d'une journée (heure de Paris)
journee:
  - {heure: "10:00", type: video, reseaux: [instagram_reel, tiktok], episode: 1}
  - {heure: "12:00", type: story, reseaux: [instagram], episode: 1}   # question liée à la vidéo de 10 h
  - {heure: "18:00", type: video, reseaux: [instagram_reel, tiktok], episode: 2}
  - {heure: "19:00", type: story, reseaux: [instagram], episode: 2}   # question liée à la vidéo de 18 h

# Les TROIS piliers officiels du compte (décision d'Ilan du 3 nov.). Aucun autre concept sans son accord.
piliers:
  devine_construction:
    nom: "Devine ce que je construis"
    principe: "construction pièce par pièce avec mystère, l'objet n'est nommé qu'à la fin"
    accroche: "Devine ce que je construis. Réponse à la fin."
    couverture_entete: "DEVINE CE QUE JE CONSTRUIS"
    modele: ep02-stylo
  fait_expres:
    nom: "Ce n'est pas un défaut, c'est fait exprès"
    principe: "un défaut apparent qui est en fait voulu"
    accroche: "Ce n'est pas un défaut."
    couverture_entete: "CE N'EST PAS UN DÉFAUT"
    modele: ep01-ballast
  forme_contre_intuitive:
    nom: "Les formes contre-intuitives"
    principe: "une forme qui surprend, justifiée par un chiffre fort ou une expérience simple"
    accroche: "Cette forme a l'air absurde."
    couverture_entete: "FORME CONTRE-INTUITIVE"
    modele: ep03-hublots

# Rotation : 10:00 = pilier suivant le dernier pilier publié (tableau-de-bord/etat.json → dernier_pilier),
# 18:00 = le suivant. Jamais deux fois le même pilier d'affilée, jamais deux fois le même dans la journée.
rotation: [devine_construction, fait_expres, forme_contre_intuitive]

taches_cloud:
  production_soir: "20:30"     # produit et programme les contenus du lendemain
  verification_matin: "07:30"  # vérifie que les publications du jour sont en place
